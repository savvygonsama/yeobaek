<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여백</title>
<meta name="description" content="충동과 행동 사이에 여백을 두는 도파민 디톡스 앱">
<meta name="theme-color" content="#F2EEE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191917" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EEE5;        /* 한지 */
    --paper: #F8F5EE;
    --ink: #2A2925;       /* 먹 */
    --ink-2: #5A574F;
    --sub: #8C877C;
    --line: #DDD7C9;
    --moss: #56704F;      /* 이끼 */
    --moss-soft: #E2E7DA;
    --seal: #B0503A;      /* 낙관 */
    --on-ink: #F8F5EE;
    --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
    --sans: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191917;
      --paper: #21211E;
      --ink: #E9E5DB;
      --ink-2: #C4BFB3;
      --sub: #8F8A7F;
      --line: #34332F;
      --moss: #9CB293;
      --moss-soft: #283026;
      --seal: #C86A52;
      --on-ink: #191917;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.7;
    letter-spacing: -0.005em;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  .view { min-height: calc(100dvh - 68px); display: flex; flex-direction: column; animation: settle .7s ease both; }
  @keyframes settle { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  h1, h2, h3, p { margin: 0; }
  .serif { font-family: var(--serif); }

  /* 머리 */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: 0.08em; }
  .seal {
    width: 22px; height: 22px; background: var(--seal); color: #F8F5EE; border-radius: 3px;
    font-family: var(--serif); font-size: 9px; line-height: 1; font-weight: 600;
    display: grid; place-items: center; writing-mode: vertical-rl; letter-spacing: 0;
    transform: rotate(-4deg);
  }
  .top nav { display: flex; gap: 18px; }
  .top nav button, .back { color: var(--sub); font-size: 14px; letter-spacing: 0.04em; }
  .back { align-self: flex-start; padding: 4px 0; }

  .eyebrow { color: var(--sub); font-size: 12px; letter-spacing: 0.12em; }
  .title { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.45; letter-spacing: -0.01em; }
  .lead { color: var(--ink-2); font-size: 15px; }
  .muted { color: var(--sub); font-size: 13px; }
  .center { text-align: center; }
  .grow { flex: 1; }
  .hair { height: 1px; background: var(--line); border: 0; margin: 0; }

  /* 엔소 */
  .enso { position: relative; width: var(--size, 260px); height: var(--size, 260px); margin: 0 auto; }
  .enso svg { width: 100%; height: 100%; overflow: visible; }
  .enso circle { fill: none; stroke: var(--ink); stroke-linecap: round; transition: stroke-dasharray 1s linear; }
  .enso .main { stroke-width: 9; }
  .enso .dry { stroke-width: 3; opacity: 0.35; }
  .enso .ghost { stroke: var(--line); stroke-width: 1; }
  .enso-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .enso-btn { display: block; margin: 0 auto; border-radius: 50%; transition: transform .4s ease; }
  .enso-btn:active { transform: scale(0.97); }
  .enso-say { font-family: var(--serif); font-size: 22px; line-height: 1.55; font-weight: 500; }
  .enso-time { font-family: var(--serif); font-size: 46px; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

  /* 버튼 */
  .btn { display: block; width: 100%; padding: 17px 20px; border-radius: 999px; font-size: 15.5px; font-weight: 400; letter-spacing: 0.02em; text-align: center; transition: opacity .2s; }
  .btn:active { opacity: .7; }
  .btn.ink { background: var(--ink); color: var(--on-ink); }
  .btn.line { border: 1px solid var(--line); color: var(--ink); }
  .btn.quiet { color: var(--sub); font-size: 14px; padding: 12px; }
  .btn.danger { color: var(--seal); font-size: 14px; padding: 12px; }
  .stack > * + * { margin-top: 10px; }

  /* 오늘 */
  .today-line { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
  .today-num { font-family: var(--serif); font-size: 40px; font-weight: 400; color: var(--moss); line-height: 1; }

  /* 먹선 막대 */
  .sticks { display: flex; align-items: flex-end; justify-content: space-between; height: 92px; padding: 0 2px; }
  .sticks .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; height: 100%; }
  .sticks .n { font-size: 11px; color: var(--sub); font-family: var(--serif); }
  .sticks .stick { width: 2px; border-radius: 2px; background: var(--ink); opacity: .75; }
  .sticks .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--line); }
  .sticks .d { font-size: 11px; color: var(--sub); }
  .sticks .col.is-today .stick { background: var(--moss); opacity: 1; width: 3px; }
  .sticks .col.is-today .d { color: var(--ink); font-weight: 500; }

  /* 고르기 */
  .whispers { display: grid; gap: 0; }
  .whisper { display: flex; justify-content: space-between; align-items: center; padding: 18px 2px; border-top: 1px solid var(--line); font-family: var(--serif); font-size: 18px; text-align: left; }
  .whisper:last-child { border-bottom: 1px solid var(--line); }
  .whisper .k { font-family: var(--sans); font-size: 12px; color: var(--sub); letter-spacing: .1em; }
  .whisper:active { background: var(--moss-soft); }

  /* 대신 할 것 */
  .alts { list-style: none; margin: 0; padding: 0; }
  .alt { width: 100%; display: flex; align-items: center; gap: 14px; padding: 15px 2px; border-top: 1px solid var(--line); font-size: 16px; font-weight: 400; text-align: left; }
  .alts li:last-child .alt { border-bottom: 1px solid var(--line); }
  .alt .mark { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--sub); flex: none; display: grid; place-items: center; transition: all .25s; }
  .alt.on .mark { border-color: var(--moss); background: var(--moss); }
  .alt.on .mark::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--on-ink); }
  .alt.on { color: var(--moss); }

  .field { display: flex; gap: 8px; margin-top: 14px; }
  .field input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); outline: none;
  }
  .field input:focus { border-color: var(--sub); }
  .field button { padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }

  /* 설정 */
  .section { padding: 26px 0; border-top: 1px solid var(--line); }
  .section:first-of-type { border-top: 0; }
  .section h3 { font-family: var(--serif); font-weight: 500; font-size: 16px; margin-bottom: 14px; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; padding: 11px 0; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
  .seg button.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .row:first-child { border-top: 0; }
  .row .x { color: var(--sub); font-size: 18px; padding: 2px 8px; }

  /* 기록 */
  .month { border-top: 1px solid var(--line); }
  .month:last-child { border-bottom: 1px solid var(--line); }
  .month summary { list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; cursor: pointer; }
  .month summary::-webkit-details-marker { display: none; }
  .month summary .m { font-family: var(--serif); font-size: 17px; }
  .month summary .m::before { content: '＋'; color: var(--sub); font-size: 12px; margin-right: 10px; display: inline-block; transition: transform .3s; }
  .month[open] summary .m::before { content: '－'; }
  .tally { font-size: 13px; color: var(--sub); }
  .tally b { color: var(--moss); font-weight: 500; }
  .day { padding: 4px 0 18px; }
  .day-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); padding: 8px 0 6px; }
  .entry { display: grid; grid-template-columns: 46px 1fr auto; gap: 4px 10px; padding: 8px 0; font-size: 14px; border-top: 1px dashed var(--line); }
  .entry:first-of-type { border-top: 0; }
  .entry .t { color: var(--sub); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 1px; }
  .entry .w { font-family: var(--serif); }
  .entry .r { font-size: 12px; color: var(--moss); padding-top: 2px; }
  .entry .r.follow { color: var(--sub); }
  .entry .a { grid-column: 2 / 4; color: var(--ink-2); font-size: 13px; }
  .entry .a::before { content: '→ '; color: var(--sub); }
</style>
</head>
<body>
<main id="app"></main>

<script>
(() => {
  const KEY = 'yeobaek.v1';
  const OLD_KEY = 'jamkkan.v1';
  // 뇌는 늘 "딱 하나만"이라고 속삭인다. key는 기록용, say는 화면에 보이는 뇌의 말
  const URGES = [
    { key: '쇼츠', say: '쇼츠 딱 하나만' },
    { key: 'SNS', say: '피드 잠깐만' },
    { key: '과자', say: '과자 한 입만' },
    { key: '웹툰', say: '웹툰 한 화만' },
    { key: '인터넷', say: '아무거나 검색만' },
    { key: '기타', say: '그냥 뭔가 자극' }
  ];
  const DELAYS = [5, 10, 15, 30];
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const DEFAULTS = {
    delayMin: 10,
    alternatives: ['스쿼트하기', '산책하기', '심호흡하기', '책보기'],
    active: null, // { urge, firstAt, startedAt, endAt, rounds, alts: [] }
    log: [],      // { t, day, urge, result: 'success' | 'gave', rounds, alts: [] }
    lastBackupAt: null
  };

  const sayOf = key => (URGES.find(u => u.key === key) || { say: key }).say;
  const altsOf = e => e.alts || (e.alt ? [e.alt] : []); // 예전 기록은 alt 하나를 문자열로 갖고 있다

  const app = document.getElementById('app');
  let state = load();
  let view = state.active ? (Date.now() >= state.active.endAt ? 'check' : 'timer') : 'home';
  let ticker = null;
  let persisted = false;

  // ---------- 저장 ----------
  function load() {
    const fresh = JSON.parse(JSON.stringify(DEFAULTS));
    try {
      const raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
      if (raw) {
        const s = Object.assign(fresh, JSON.parse(raw));
        s.log = s.log.map(e => ({ ...e, alts: altsOf(e) }));
        if (s.active) s.active.alts = altsOf(s.active);
        return s;
      }
    } catch (e) {}
    return fresh;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // 폰이 저장 공간을 정리할 때도 이 앱의 기록은 지우지 않도록 요청한다
  (async () => {
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      if (view === 'settings') render();
    } catch (e) {}
  })();

  function backupFile() {
    const data = JSON.stringify({
      app: 'yeobaek', version: 1, exportedAt: new Date().toISOString(),
      delayMin: state.delayMin, alternatives: state.alternatives, log: state.log
    }, null, 2);
    return new File([data], `yeobaek-backup-${dayKey()}.json`, { type: 'application/json' });
  }
  function canShareFile() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [backupFile()] })); }
    catch (e) { return false; }
  }

  // ---------- 날짜 ----------
  function dayKey(d = new Date()) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function lastDays(n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() - i);
      out.push(d);
    }
    return out;
  }
  function letGoOn(key) {
    return state.log.filter(e => e.day === key && e.result === 'success').length;
  }
  const hhmm = t => new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mmss = ms => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };

  // ---------- 조각 ----------
  // 붓으로 그린 원. progress 0~1 만큼 그려진다. 끝을 살짝 열어 두는 게 엔소의 맛
  const OPEN = 92;
  function enso(progress, size, inner, id = 'e') {
    const main = Math.max(0.001, progress * OPEN);
    const dry = Math.max(0.001, progress * OPEN - 14);
    return `
      <div class="enso" style="--size:${size}px">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <filter id="brush-${id}" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
            </filter>
          </defs>
          <circle class="ghost" cx="100" cy="100" r="80"></circle>
          <g filter="url(#brush-${id})" transform="rotate(-100 100 100)">
            <circle class="main" id="${id}-main" cx="100" cy="100" r="80" pathLength="100" stroke-dasharray="${main} 200"></circle>
            <circle class="dry" id="${id}-dry" cx="100" cy="100" r="85" pathLength="100" stroke-dasharray="${dry} 200" stroke-dashoffset="-4"></circle>
          </g>
        </svg>
        <div class="enso-inner">${inner}</div>
      </div>`;
  }

  function sticks(days, weekdayLabels) {
    const data = days.map(d => ({ d, n: letGoOn(dayKey(d)) }));
    const max = Math.max(1, ...data.map(x => x.n));
    const today = dayKey();
    return `<div class="sticks">${data.map(({ d, n }) => `
      <div class="col ${dayKey(d) === today ? 'is-today' : ''}">
        <span class="n">${n || ''}</span>
        ${n ? `<span class="stick" style="height:${Math.max(10, (n / max) * 60)}px"></span>` : '<span class="dot"></span>'}
        <span class="d">${weekdayLabels ? WEEKDAYS[d.getDay()] : d.getDate()}</span>
      </div>`).join('')}</div>`;
  }

  function altList(picked) {
    const extra = picked.filter(t => !state.alternatives.includes(t)); // 직접 적은 것
    return `<ul class="alts">${[...state.alternatives, ...extra].map(t => `
      <li><button class="alt ${picked.includes(t) ? 'on' : ''}" data-alt="${esc(t)}">
        <span class="mark"></span><span>${esc(t)}</span>
      </button></li>`).join('')}</ul>`;
  }

  const header = () => `
    <header class="top">
      <div class="brand"><span class="seal">餘白</span><h1>여백</h1></div>
      <nav><button data-go="history">기록</button><button data-go="settings">설정</button></nav>
    </header>`;

  // ---------- 화면 ----------
  const views = {
    home() {
      const a = state.active;
      const n = letGoOn(dayKey());
      let circle;
      if (a) {
        const ended = Date.now() >= a.endAt;
        const p = ended ? 1 : (Date.now() - a.startedAt) / (a.endAt - a.startedAt);
        circle = `<button class="enso-btn" data-go="${ended ? 'check' : 'timer'}" aria-label="여백 이어가기">
          ${enso(p, 270, `<span class="eyebrow">여백을 두는 중</span>
            <span class="enso-time" id="mini">${mmss(a.endAt - Date.now())}</span>`, 'h')}</button>`;
      } else {
        circle = `<button class="enso-btn" data-go="pick" aria-label="뇌가 도파민을 원해">
          ${enso(1, 270, '<span class="enso-say">뇌가<br>도파민을 원해</span>', 'h')}</button>`;
      }
      return `
        ${header()}
        <div class="grow" style="display:flex;flex-direction:column;justify-content:center;padding:40px 0 24px">
          ${circle}
          <p class="muted center" style="margin-top:22px">${a ? '원을 누르면 이어서 볼 수 있어요' : '욕구가 올라오면 원을 눌러요'}</p>
        </div>
        <div class="center" style="margin-bottom:26px">
          <p class="eyebrow">오늘 흘려보낸 욕구</p>
          <div class="today-line" style="margin-top:8px"><span class="today-num">${n}</span></div>
        </div>
        ${sticks(lastDays(7), true)}`;
    },

    pick() {
      return `
        <button class="back" data-go="home">← 돌아가기</button>
        <div style="padding:48px 0 32px">
          <p class="eyebrow">지금 들리는 말</p>
          <h2 class="title" style="margin-top:10px">뇌가 뭐라고<br>속삭이나요?</h2>
          <p class="lead" style="margin-top:10px">고르면 ${state.delayMin}분의 여백이 시작돼요.</p>
        </div>
        <div class="whispers">
          ${URGES.map(u => `<button class="whisper" data-urge="${esc(u.key)}">“${esc(u.say)}”<span class="k">${esc(u.key)}</span></button>`).join('')}
        </div>`;
    },

    timer() {
      const a = state.active;
      const total = a.endAt - a.startedAt;
      const p = (Date.now() - a.startedAt) / total;
      return `
        <button class="back" data-go="home">← 처음으로</button>
        <div class="center" style="padding:22px 0 8px">
          <p class="eyebrow">“${esc(sayOf(a.urge))}”</p>
          <h2 class="title" style="margin-top:6px">${a.rounds > 1 ? '한 번 더, 여백을' : '숨을 고르며 바라봐요'}</h2>
        </div>
        ${enso(p, 230, `<span class="enso-time" id="clock">${mmss(a.endAt - Date.now())}</span>`, 't')}
        <p class="eyebrow center" style="margin:30px 0 6px">그 사이, 몸에게 다른 것을</p>
        ${altList(a.alts)}
        <div class="stack" style="margin-top:26px">
          <button class="btn ink" data-act="success">도파민 욕구가 사라졌어</button>
          <button class="btn quiet" data-act="gave">이번엔 따라갈게</button>
        </div>`;
    },

    check() {
      const a = state.active;
      const mins = Math.max(1, Math.round((a.endAt - (a.firstAt || a.startedAt)) / 60000));
      return `
        <div class="grow" style="display:flex;flex-direction:column;justify-content:center">
          ${enso(1, 150, '', 'c')}
          <div class="center" style="margin-top:28px">
            <p class="eyebrow">${mins}분의 여백</p>
            <h2 class="title" style="margin-top:8px">“${esc(sayOf(a.urge))}”<br>그 욕구, 아직 남아 있나요?</h2>
          </div>
          <div class="stack" style="margin-top:36px">
            <button class="btn ink" data-act="success">아니, 욕구가 사라졌어</button>
            <button class="btn line" data-act="more">아직 남아 있어 · ${state.delayMin}분 더</button>
            <button class="btn quiet" data-act="gave">이번엔 따라갈게</button>
          </div>
        </div>`;
    },

    what() {
      const a = state.active;
      return `
        <div style="padding:40px 0 24px">
          <p class="eyebrow">흘려보내기 전에</p>
          <h2 class="title" style="margin-top:10px">그 사이,<br>무엇을 했나요?</h2>
          <p class="lead" style="margin-top:10px">기록에 남겨 둘게요. 여러 개 골라도 돼요.</p>
        </div>
        ${altList(a.alts)}
        <form class="field" id="whatForm">
          <input id="whatInput" maxlength="30" placeholder="직접 적기" autocomplete="off">
          <button type="submit">더하기</button>
        </form>
        <div class="stack" style="margin-top:28px">
          <button class="btn ink" data-act="record">기록하기</button>
          <button class="btn quiet" data-act="recordNone">딱히 한 건 없어요</button>
        </div>`;
    },

    done() {
      const n = letGoOn(dayKey());
      const last = state.log[state.log.length - 1];
      const did = last ? altsOf(last) : [];
      return `
        <div class="grow" style="display:flex;flex-direction:column;justify-content:center">
          ${enso(1, 190, '<span class="enso-say" style="font-size:18px">흘려보냄</span>', 'd')}
          <div class="center" style="margin-top:30px">
            <h2 class="title">욕구가 지나갔어요</h2>
            <p class="lead" style="margin-top:10px">오늘 ${n}번째예요.<br>욕구는 구름처럼 왔다가 가요.</p>
            ${did.length ? `<p class="muted" style="margin-top:16px">대신 한 것 · ${did.map(esc).join(', ')}</p>` : ''}
          </div>
          <div style="margin-top:40px"><button class="btn line" data-go="home">처음으로</button></div>
        </div>`;
    },

    gave() {
      return `
        <div class="grow" style="display:flex;flex-direction:column;justify-content:center">
          ${enso(0.55, 150, '', 'g')}
          <div class="center" style="margin-top:30px">
            <h2 class="title">괜찮아요</h2>
            <p class="lead" style="margin-top:10px">바로 따르지 않고 멈춰 바라본 것,<br>그것도 수행이에요.</p>
          </div>
          <div style="margin-top:40px"><button class="btn line" data-go="home">처음으로</button></div>
        </div>`;
    },

    history() {
      // 기록은 지우지 않는다. 전부 월별로 묶고 이번 달만 펼쳐 둔다
      const byDay = new Map();
      for (const e of state.log) {
        if (!byDay.has(e.day)) byDay.set(e.day, []);
        byDay.get(e.day).push(e);
      }
      const months = new Map();
      for (const k of [...byDay.keys()].sort().reverse()) {
        const mk = k.slice(0, 7);
        if (!months.has(mk)) months.set(mk, []);
        months.get(mk).push(k);
      }
      const count = (list, r) => list.filter(e => e.result === r).length;

      const weekAgo = Date.now() - 7 * 86400000;
      const urgeCount = {}, altCount = {};
      for (const e of state.log) {
        if (e.t < weekAgo) continue;
        urgeCount[sayOf(e.urge)] = (urgeCount[sayOf(e.urge)] || 0) + 1;
        for (const t of altsOf(e)) altCount[t] = (altCount[t] || 0) + 1;
      }
      const top = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, 3)
        .map(([k, v]) => `${esc(k)} ${v}`).join(' · ');
      const total = count(state.log, 'success');
      const first = state.log.length ? state.log.reduce((m, e) => (e.t < m ? e.t : m), state.log[0].t) : null;

      const dayLabel = key => {
        const [y, m, d] = key.split('-').map(Number);
        return `${m}월 ${d}일 ${WEEKDAYS[new Date(y, m - 1, d).getDay()]}요일`;
      };

      return `
        <button class="back" data-go="home">← 처음으로</button>
        <div style="padding:36px 0 28px">
          <p class="eyebrow">지금까지 흘려보낸 욕구</p>
          <p class="today-num" style="font-size:48px;margin-top:10px">${total}</p>
          ${first ? `<p class="muted" style="margin-top:8px">${new Date(first).toLocaleDateString('ko-KR')}부터의 기록</p>` : ''}
        </div>
        <p class="eyebrow" style="margin-bottom:12px">최근 14일</p>
        ${sticks(lastDays(14), false)}
        ${top(urgeCount) || top(altCount) ? `
          <div style="margin-top:30px" class="stack">
            ${top(urgeCount) ? `<p class="muted">이번 주 자주 들린 말 &nbsp;<span style="color:var(--ink)">${top(urgeCount)}</span></p>` : ''}
            ${top(altCount) ? `<p class="muted">대신 한 것 &nbsp;<span style="color:var(--ink)">${top(altCount)}</span></p>` : ''}
          </div>` : ''}
        <div style="margin-top:34px">
          ${months.size ? [...months.entries()].map(([mk, days], i) => {
            const [y, mo] = mk.split('-').map(Number);
            const all = days.flatMap(k => byDay.get(k));
            return `<details class="month" ${i === 0 ? 'open' : ''}>
              <summary><span class="m">${y}년 ${mo}월</span>
                <span class="tally">흘려보냄 <b>${count(all, 'success')}</b>${count(all, 'gave') ? ` · 따라감 ${count(all, 'gave')}` : ''}</span></summary>
              ${days.map(k => {
                const list = byDay.get(k).slice().sort((a, b) => b.t - a.t);
                return `<div class="day">
                  <div class="day-head"><span>${dayLabel(k)}</span>
                    <span class="tally">흘려보냄 <b>${count(list, 'success')}</b>${count(list, 'gave') ? ` · 따라감 ${count(list, 'gave')}` : ''}</span></div>
                  ${list.map(e => `<div class="entry">
                    <span class="t">${hhmm(e.t)}</span>
                    <span class="w">“${esc(sayOf(e.urge))}”</span>
                    <span class="r ${e.result === 'success' ? '' : 'follow'}">${e.result === 'success' ? '흘려보냄' : '따라감'}</span>
                    ${altsOf(e).length ? `<span class="a">${altsOf(e).map(esc).join(', ')}</span>` : ''}
                  </div>`).join('')}
                </div>`;
              }).join('')}
            </details>`;
          }).join('') : '<p class="muted center" style="padding:30px 0">아직 기록이 없어요.<br>첫 여백을 두어 보세요.</p>'}
        </div>
        <p class="muted center" style="margin-top:28px">기록은 지워지지 않고 이 폰에 쌓여요.<br>폰을 바꾸기 전엔 설정에서 백업해 두세요.</p>`;
    },

    settings() {
      return `
        <button class="back" data-go="home">← 처음으로</button>
        <h2 class="title" style="padding:32px 0 8px">설정</h2>
        <section class="section">
          <h3>여백의 길이</h3>
          <div class="seg">
            ${DELAYS.map(m => `<button class="${state.delayMin === m ? 'on' : ''}" data-delay="${m}">${m}분</button>`).join('')}
          </div>
        </section>
        <section class="section">
          <h3>몸에게 줄 것</h3>
          <div>
            ${state.alternatives.map((t, i) => `
              <div class="row"><span>${esc(t)}</span><button class="x" data-del="${i}" aria-label="${esc(t)} 지우기">×</button></div>`).join('')}
          </div>
          <form class="field" id="addForm">
            <input id="newAlt" maxlength="30" placeholder="예: 물 한 잔 마시기" autocomplete="off">
            <button type="submit">더하기</button>
          </form>
        </section>
        <section class="section">
          <h3>기록 보관</h3>
          <p class="muted">${persisted
            ? '영구 저장이 켜져 있어요. 폰이 저장 공간을 정리해도 기록은 남아요.'
            : '영구 저장이 아직 꺼져 있어요. 홈 화면에 추가해서 쓰면 대개 자동으로 켜져요.'}</p>
          <p class="muted" style="margin-top:4px">전체 ${state.log.length}건 · 마지막 백업 ${state.lastBackupAt ? new Date(state.lastBackupAt).toLocaleDateString('ko-KR') : '없음'}</p>
          <div class="stack" style="margin-top:16px">
            ${canShareFile() ? '<button class="btn ink" data-act="share">백업 보내기 · 드라이브, 카톡 등</button>' : ''}
            <button class="btn line" data-act="export">백업 파일 저장</button>
            <label class="btn line">백업 불러오기<input type="file" id="importFile" accept="application/json,.json" hidden></label>
          </div>
        </section>
        <section class="section center">
          <button class="btn danger" data-act="reset">기록 모두 지우기</button>
        </section>`;
    }
  };

  // ---------- 그리기 ----------
  function go(next) {
    view = next;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (['timer', 'check', 'what'].includes(view) && !state.active) view = 'home';
    if (view === 'timer' && Date.now() >= state.active.endAt) view = 'check';
    app.innerHTML = `<div class="view">${views[view]()}</div>`;
    clearInterval(ticker);
    const running = state.active && Date.now() < state.active.endAt;
    if (running && (view === 'timer' || view === 'home')) {
      tick();
      ticker = setInterval(tick, 1000);
    }
  }

  function tick() {
    const a = state.active;
    if (!a) return;
    const left = a.endAt - Date.now();
    if (left <= 0) {
      clearInterval(ticker);
      if (view === 'timer') {
        if (navigator.vibrate) navigator.vibrate([200, 120, 200]);
        go('check');
      } else {
        render();
      }
      return;
    }
    const p = 1 - left / (a.endAt - a.startedAt);
    for (const id of ['t', 'h']) {
      const main = document.getElementById(`${id}-main`);
      const dry = document.getElementById(`${id}-dry`);
      if (main) main.setAttribute('stroke-dasharray', `${Math.max(0.001, p * OPEN)} 200`);
      if (dry) dry.setAttribute('stroke-dasharray', `${Math.max(0.001, p * OPEN - 14)} 200`);
    }
    for (const id of ['clock', 'mini']) {
      const el = document.getElementById(id);
      if (el) el.textContent = mmss(left);
    }
  }

  // ---------- 동작 ----------
  function startUrge(urge) {
    const now = Date.now();
    state.active = { urge, firstAt: now, startedAt: now, endAt: now + state.delayMin * 60000, rounds: 1, alts: [] };
    save();
    go('timer');
  }

  function record(result) {
    const a = state.active;
    if (!a) return go('home');
    state.log.push({ t: Date.now(), day: dayKey(), urge: a.urge, result, rounds: a.rounds, alts: a.alts.slice() });
    state.active = null;
    save();
    go(result === 'success' ? 'done' : 'gave');
  }

  function delayMore() {
    const a = state.active;
    const now = Date.now();
    a.startedAt = now;
    a.endAt = now + state.delayMin * 60000;
    a.rounds += 1;
    save();
    go('timer');
  }

  function toggleAlt(t) {
    const a = state.active;
    if (!a) return;
    a.alts = a.alts.includes(t) ? a.alts.filter(x => x !== t) : [...a.alts, t];
    save();
    render();
  }

  async function shareBackup() {
    try {
      await navigator.share({ files: [backupFile()], title: '여백 기록 백업' });
      state.lastBackupAt = Date.now();
      save();
      render();
    } catch (e) {}
  }

  function exportBackup() {
    const url = URL.createObjectURL(backupFile());
    const link = document.createElement('a');
    link.href = url;
    link.download = `yeobaek-backup-${dayKey()}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    state.lastBackupAt = Date.now();
    save();
    render();
  }

  async function importBackup(file) {
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.log)) throw new Error('bad');
      const seen = new Set(state.log.map(e => `${e.t}|${e.urge}`));
      let added = 0;
      for (const e of data.log) {
        if (typeof e.t !== 'number' || seen.has(`${e.t}|${e.urge}`)) continue;
        state.log.push({ ...e, alts: altsOf(e) });
        seen.add(`${e.t}|${e.urge}`);
        added++;
      }
      state.log.sort((a, b) => a.t - b.t);
      for (const t of data.alternatives || []) if (!state.alternatives.includes(t)) state.alternatives.push(t);
      save();
      render();
      alert(added ? `${added}건을 불러왔어요.` : '새로 더할 기록이 없어요.');
    } catch (e) {
      alert('백업 파일을 읽지 못했어요.');
    }
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('button');
    if (!el) return;
    const d = el.dataset;
    if (d.go) return go(d.go);
    if (d.urge) return startUrge(d.urge);
    if (d.alt !== undefined) return toggleAlt(d.alt);
    if (d.delay) { state.delayMin = Number(d.delay); save(); return render(); }
    if (d.del !== undefined) { state.alternatives.splice(Number(d.del), 1); save(); return render(); }
    switch (d.act) {
      case 'success':
        // 대신 한 걸 아직 안 골랐으면 한 번 묻고 기록한다
        return state.active && state.active.alts.length ? record('success') : go('what');
      case 'record': return record('success');
      case 'recordNone': if (state.active) state.active.alts = []; return record('success');
      case 'gave': return record('gave');
      case 'more': return delayMore();
      case 'share': return shareBackup();
      case 'export': return exportBackup();
      case 'reset':
        if (confirm('지금까지의 기록을 모두 지울까요?\n백업하지 않았다면 되돌릴 수 없어요.')) {
          state.log = [];
          state.active = null;
          save();
          render();
        }
        return;
    }
  });

  app.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'addForm') {
      const v = document.getElementById('newAlt').value.trim();
      if (v && !state.alternatives.includes(v)) { state.alternatives.push(v); save(); }
      render();
      document.getElementById('newAlt')?.focus();
    } else if (e.target.id === 'whatForm') {
      const v = document.getElementById('whatInput').value.trim();
      if (v && state.active && !state.active.alts.includes(v)) { state.active.alts.push(v); save(); }
      render();
    }
  });

  app.addEventListener('change', e => {
    if (e.target.id === 'importFile' && e.target.files[0]) importBackup(e.target.files[0]);
  });

  // 다른 앱에 다녀왔을 때 타이머가 끝났으면 바로 확인 화면으로
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && view !== 'what') render();
  });

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
